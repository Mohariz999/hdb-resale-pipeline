name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    # A throwaway Postgres for this job only, so every push builds and tests the real models.
    services:
      warehouse:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hdb
          POSTGRES_PASSWORD: hdb
          POSTGRES_DB: hdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hdb"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "dbt-postgres==1.11.0" ruff

      - name: Lint DAG code
        run: ruff check dags

      - name: Check DAG formatting
        run: ruff format --check dags

      - name: Load sample data into raw
        env:
          PGPASSWORD: hdb
        run: psql -h localhost -p 5433 -U hdb -d hdb -v ON_ERROR_STOP=1 -f ci/create_raw.sql

      - name: Build and test the dbt models
        working-directory: dbt
        run: dbt build --profiles-dir .
